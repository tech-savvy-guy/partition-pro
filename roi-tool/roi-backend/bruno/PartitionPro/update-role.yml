info:
  name: update-role
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseURL}}/security/v1.0/roles/{{role_id}}/update"
  body:
    type: json
    data: |-
      {
        "role_name": "Senior Manager",
        "permissions": {
          "can_view_users": true,
          "can_edit_users": true
        },
        "is_super_user": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
