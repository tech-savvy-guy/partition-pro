info:
  name: poll-auto-partition-tree
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseURL}}{{auto_break_polling_url}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = typeof body === "string" ? JSON.parse(body) : body;

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns a workflow polling status", function () {
          const allowed = ["QUEUED", "RUNNING", "COMPLETED", "FAILED", "NO_PROGRESS"];
          expect(typeof data.status).to.equal("string");
          expect(allowed.includes(data.status)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Polling contract for Automatic Partition Tree.

  Use this endpoint after `run-auto-partition-tree` returns HTTP 202.
  The `task_id` from the queue response is informational; clients should poll the returned `polling_url`:

  GET `{{baseURL}}{{auto_break_polling_url}}`

  The `poll-auto-partition-tree` request must use the exact `polling_url` returned by `run-auto-partition-tree`.
  For node-specific auto-break runs, that URL contains `?root_node_id=...`; without that query param, the backend polls the root/null progress key instead.

  Immediately after the POST returns, polling should see the fresh Redis `QUEUED` snapshot published by the backend before enqueue. That `QUEUED` snapshot covers the enqueue-to-worker-start gap and prevents clients from reading stale completed DB fallback data from the previous run.

  Queued Redis response:
  {
    "process": "auto_break_partition_tree",
    "status": "QUEUED",
    "percent": 0.0,
    "root_node_id": "<node-id-or-null>",
    "polling_url": "/reports/v1.0/workflows/<case_id>/<partition_id>/tree/auto-break",
    "params": {}
  }

  In-flight Redis response:
  {
    "run_id": "<run-id>",
    "process": "auto_break_partition_tree",
    "status": "RUNNING",
    "percent": 0.0,
    "expanded_count": 0,
    "visited_count": 1
  }

  Completed Redis response:
  {
    "run_id": "<run-id>",
    "process": "auto_break_partition_tree",
    "status": "COMPLETED",
    "percent": 100.0,
    "expanded_count": 4,
    "skipped_count": 8,
    "partition_tree": {
      "result": {
        "tree": {}
      },
      "auto_break": {}
    },
    "tree": {},
    "auto_break": {}
  }

  Failed Redis response:
  {
    "run_id": "<run-id>",
    "process": "auto_break_partition_tree",
    "status": "FAILED",
    "percent": 100.0,
    "error": "<failure reason>",
    "partition_tree": {},
    "tree": {},
    "auto_break": {}
  }

  DB fallback response when Redis progress is absent and auto-break has written the partition tree:
  {
    "status": "COMPLETED",
    "workflow_status": "COMPLETED",
    "case_id": "<case_id>",
    "partition_id": "<partition_id>",
    "root_node_id": null,
    "partition_tree": {
      "result": {
        "tree": {}
      },
      "auto_break": {}
    },
    "tree": {},
    "auto_break": {},
    "source": "db"
  }

  DB fallback response when Redis progress is absent and auto-break has not run for this polling key:
  {
    "status": "NO_PROGRESS",
    "workflow_status": "COMPLETED",
    "partition_tree": {
      "result": {
        "tree": {}
      }
    },
    "tree": {},
    "auto_break": {},
    "source": "db"
  }

  Redis polling statuses are `QUEUED`, `RUNNING`, `COMPLETED`, or `FAILED`.
  Redis progress is authoritative when present. DB fallback is used only when Redis progress is absent.
  The updated partition tree is always read from `partition_tree.result.tree` or the top-level `tree` alias.
  Completion is confirmed when `status` is `COMPLETED`.
  Failure is confirmed when `status` is `FAILED`; display `error` if present.
  `NO_PROGRESS` means the worker has not written auto-break metadata for the exact case/partition/root_node_id being polled.
