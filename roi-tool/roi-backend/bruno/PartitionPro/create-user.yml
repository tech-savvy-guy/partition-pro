info:
  name: create-user
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/security/v1.0/users/create"
  body:
    type: json
    data: |-
      {
        "email": "{{create_user_email}}",
        "username": "{{create_username}}",
        "name": "{{create_user_name}}",
        "password": "{{create_user_password}}",
        "role_id": "{{role_id}}",
        "tenant_id": "{{tenant_id}}",
        "designation": "Senior Engineer",
        "company": "Acme Corporation",
        "created_by": "{{created_by}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
