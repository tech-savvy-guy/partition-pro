info:
  name: heartbeat-lock
  type: http
  seq: 50

http:
  method: PATCH
  url: "{{baseURL}}/reports/v1.0/cases/{{case_id}}/partitions/{{partition_id}}/lock"
  body:
    type: json
    data: |-
      {
        "_refresh_lock": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
