info:
  name: upload-url
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseURL}}/reports/v1.0/cases/{{case_id}}/datasets/POS/upload-url"
  body:
    type: json
    data: |-
      {
        "file_name": "{{dataset_file_name}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = typeof body === "string" ? JSON.parse(body) : body;
        bru.setEnvVar("upload_url", data.upload_url);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
