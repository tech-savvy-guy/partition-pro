info:
  name: unlock-partition
  type: http
  seq: 51

http:
  method: POST
  url: "{{baseURL}}/reports/v1.0/cases/{{case_id}}/partitions/{{partition_id}}/unlock"
  body:
    type: json
    data: |-
      {
        "unlocked": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
