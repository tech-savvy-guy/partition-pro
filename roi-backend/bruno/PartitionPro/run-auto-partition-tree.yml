info:
  name: run-auto-partition-tree
  type: http
  seq: 37

http:
  method: POST
  url: "{{baseURL}}/reports/v1.0/workflows/{{case_id}}/{{partition_id}}/tree/auto-break"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "root_node_id": null,
        "max_depth": {{auto_break_max_depth}},
        "min_node_skus": {{auto_break_min_node_skus}},
        "candidate_attributes": {{auto_break_candidate_attributes}}
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = typeof body === "string" ? JSON.parse(body) : body;

        test("Status code is 202", function () {
          expect(res.getStatus()).to.equal(202);
        });

        test("Returns an auto-break status and polling URL", function () {
          const allowed = ["QUEUED", "RUNNING", "COMPLETED"];
          expect(allowed.includes(data.status)).to.equal(true);
          expect(typeof data.polling_url).to.equal("string");
          expect(data.polling_url).to.include("/tree/auto-break");
          if (data.root_node_id) {
            expect(data.polling_url).to.include(`root_node_id=${encodeURIComponent(data.root_node_id)}`);
          }
          bru.setEnvVar("auto_break_polling_url", data.polling_url);
        });

        test("Dedicated auto-break polling URL is returned", function () {
          expect(data.polling_url).to.include("/reports/v1.0/workflows/");
          expect(data.polling_url).to.include("/tree/auto-break");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Automatic Partition Tree contract.

  Preconditions:
  - A workflow row exists for the case/partition.
  - `steps.partition_tree.result.tree` already exists. Run the full workflow or partition tree first.
  - The request uses inherited collection authentication.

  Request:
  - `root_node_id`: optional string set directly in the JSON body. Use `null` to start from the current tree root.
  - `max_depth`: positive integer. Default backend value is 3.
  - `min_node_skus`: positive integer. Default backend value is 20.
  - `candidate_attributes`: null or an array of attribute names, for example `["Brand", "Region"]`.

  Success response: HTTP 202
  {
    "status": "QUEUED",
    "task_id": "<celery-task-id>",
    "root_node_id": null,
    "polling_url": "/reports/v1.0/workflows/<case_id>/<partition_id>/tree/auto-break"
  }

  If matching auto-break progress already exists, the API returns it instead of queueing duplicate work:
  {
    "status": "RUNNING",
    "root_node_id": "<node-id-or-null>",
    "polling_url": "/reports/v1.0/workflows/<case_id>/<partition_id>/tree/auto-break",
    "data": {}
  }

  Queueing contract:
  - The backend checks the dedicated auto-break Redis progress key before starting a new run.
  - Matching `QUEUED`, `RUNNING`, or `COMPLETED` progress is reused and no duplicate task is queued.
  - Mismatched progress is deleted before a new task is queued.
  - The backend publishes a Redis progress snapshot with status `QUEUED` before the Celery task is enqueued.
  - Because `QUEUED` is available immediately, polling the auto-break URL during the enqueue-to-worker-start gap should return fresh Redis progress instead of stale DB fallback data from a prior completed run.

  Poll with the `poll-auto-partition-tree` Bruno request:
  `{{baseURL}}{{auto_break_polling_url}}`.
  Always use the `polling_url` returned by the POST response. If `root_node_id` is non-null, that URL includes `?root_node_id=...`; dropping the query polls a different auto-break progress key.
  Polling statuses are `QUEUED`, `RUNNING`, `COMPLETED`, or `FAILED` from Redis when available, with DB fallback only when Redis progress is absent.
  `NO_PROGRESS` from DB fallback means auto-break has not written metadata for the exact case/partition/root_node_id being polled.
  The updated partition tree is the `partition_tree.result.tree` object. The response also includes a top-level `tree` alias for convenience.
